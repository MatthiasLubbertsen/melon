name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Test backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -o melon ./cmd/melon
      - uses: actions/upload-artifact@v4
        with:
          name: melon-linux-amd64
          path: melon
          retention-days: 7

  screenshots:
    name: Screenshots (demo data)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: melon-linux-amd64
      - name: Install Playwright
        run: |
          npm install --no-save --prefix web/scripts playwright
          web/scripts/node_modules/.bin/playwright install --with-deps chromium
      - name: Start Melon in demo mode
        # Demo mode serves generated data only. No real account or secret is
        # available to this job.
        run: |
          chmod +x melon
          MELON_DEMO=1 MELON_DATA_DIR="$RUNNER_TEMP/melon" MELON_ADDR=127.0.0.1:8080 ./melon &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
      - name: Take screenshots
        run: OUT=screenshots node web/scripts/screenshots.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: error

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Pull requests only prove the image builds; nothing is published.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
